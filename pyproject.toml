[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlmodel-ext"
version = "0.4.2"
description = "Extended SQLModel infrastructure: smart metaclass, async CRUD mixins, polymorphic inheritance, optimistic locking, relation preloading, and reusable field types."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Foxerine" },
]
keywords = ["sqlmodel", "sqlalchemy", "pydantic", "async", "crud", "orm", "polymorphic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "sqlmodel>=0.0.32",
    # 2.12 is the first release shipping ``pydantic.experimental.missing_sentinel.MISSING``
    # (the object ``Unset`` is) and ``Field(exclude_if=...)`` (behind ``EXCLUDE_IF_NONE``).
    "pydantic>=2.12",
    "sqlalchemy>=2.0",
    # ``sqlmodel_ext.unset`` imports ``typing_extensions.Sentinel`` directly (to register
    # its deepcopy reducer); pydantic 2.12 already requires this floor transitively.
    "typing-extensions>=4.14.1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
cache = ["redis>=5.0", "orjson>=3.0"]
postgresql = ["orjson>=3.0"]
# ``run_pending_migration_cache_invalidations`` can discover pending tasks from
# alembic revision scripts; without alembic, pass ``tasks=`` explicitly.
alembic = ["alembic>=1.13"]
pgvector = [
    "sqlmodel-ext[postgresql]",
    "numpy>=1.24",
    "pgvector>=0.3",
]
dev = [
    # Pull in every optional feature so the full test suite can run: the
    # cached-table (fakeredis), FastAPI-integration and pgvector/NumPy tests
    # hard-import these. Keeping them here (rather than in the CI workflow)
    # makes ``uv pip install -e ".[dev]"`` reproduce CI locally.
    "sqlmodel-ext[fastapi,cache,pgvector]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "fakeredis>=2.20",
    # The library is developed and gated against basedpyright; 1.40.1 is the first
    # release that narrows ``x is Unset`` correctly.
    "basedpyright>=1.40.1",
]

[project.urls]
Homepage = "https://github.com/Foxerine/sqlmodel-ext"
Repository = "https://github.com/Foxerine/sqlmodel-ext"
Issues = "https://github.com/Foxerine/sqlmodel-ext/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlmodel_ext"]
